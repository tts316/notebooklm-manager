<!DOCTYPE html>
<html>
<head><title>Generate Extension Icons</title></head>
<body>
<p>點擊下方按鈕產生並下載圖示 PNG 檔案，然後放入 <code>icons/</code> 資料夾。</p>
<button onclick="generate()">產生並下載圖示</button>
<div id="previews" style="display:flex;gap:16px;margin-top:16px;align-items:flex-end"></div>
<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const r = size * 0.22;

  // Background rounded rect
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#4F86F7';
  ctx.fill();

  // Lines
  const lx = size * 0.22, lh = size * 0.08, lbr = lh / 2;
  const lineData = [
    { y: size * 0.28, w: size * 0.56 },
    { y: size * 0.43, w: size * 0.40 },
    { y: size * 0.58, w: size * 0.48 },
  ];
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  for (const { y, w } of lineData) {
    ctx.beginPath();
    ctx.roundRect(lx, y, w, lh, lbr);
    ctx.fill();
  }

  // Green circle badge (share indicator)
  const cx = size * 0.74, cy = size * 0.69, cr = size * 0.20;
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, Math.PI * 2);
  ctx.fillStyle = '#22C55E';
  ctx.fill();

  // Person icon inside badge
  ctx.fillStyle = 'white';
  const hcx = cx, hcy = cy - cr * 0.15, hr = cr * 0.30;
  ctx.beginPath();
  ctx.arc(hcx, hcy, hr, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(hcx, hcy + cr * 0.70, cr * 0.55, Math.PI, 0);
  ctx.fill();

  return canvas;
}

function generate() {
  const previews = document.getElementById('previews');
  previews.innerHTML = '';
  for (const size of [16, 48, 128]) {
    const canvas = drawIcon(size);
    canvas.style.border = '1px solid #ccc';
    canvas.title = `icon${size}.png`;

    const link = document.createElement('a');
    link.download = `icon${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();

    const label = document.createElement('div');
    label.style.textAlign = 'center';
    label.innerHTML = `<div>${size}×${size}</div>`;
    const wrap = document.createElement('div');
    wrap.appendChild(canvas);
    wrap.appendChild(label);
    previews.appendChild(wrap);
  }
}
</script>
</body>
</html>
